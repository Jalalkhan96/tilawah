# Netlify deploy config for the Tilawah PWA (publish dir = this folder).
# If you drag-and-drop the deploy zip on Netlify Drop, this file is read
# automatically from the site root.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/quran.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"
